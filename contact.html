<!DOCTYPE html>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="assets/images/logo.jpg" alt="Tulsa Area Forest School Logo" width="100">
            </a>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>

                    <li><a href="sessions.html" class="nav-link">Sessions</a></li>

        <section class="section text-center">
            <div class="container">
                <h1>Contact Us</h1>
                <p style="margin-bottom: 2rem;">Have questions or want to get involved? Send us a message.</p>

                <div style="max-width: 600px; margin: 0 auto 2rem;">
                    <img src="assets/images/kids-on-a-bridge.jpg" alt="Children gathering outdoors"
                        style="width: 100%; height: 300px; object-fit: cover; border-radius: var(--radius-md);">
                </div>

                <div class="tally-embed-wrap">
                    <iframe data-tally-src="https://tally.so/embed/q4jdQd?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
                        loading="lazy" width="100%" height="681" frameborder="0" marginheight="0" marginwidth="0"

                    <script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>

                </div>
            </div>
        </section>

    <footer class="site-footer"

        <div class="container text-center">
            <p>&copy; 2026 Tulsa Area Forest School. A 501(c)(3) Organization.</p>
        </div>
    </footer>

    <script src="scripts/main.js"></script>
